name: transparentro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tro}
      POSTGRES_DB: ${POSTGRES_DB:-tro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tro} -d ${POSTGRES_DB:-tro}"]
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tro}:${POSTGRES_PASSWORD:-tro}@db:5432/${POSTGRES_DB:-tro}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 30

  etl:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tro}:${POSTGRES_PASSWORD:-tro}@db:5432/${POSTGRES_DB:-tro}
      DATA_DIR: /data
    volumes:
      - etldata:/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["etl"]
    entrypoint: ["python", "-m", "tro.etl"]
    command: ["--help"]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_COUNTY: ${DEFAULT_COUNTY:-SB}
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  etldata:
