[project]
name = "tro"
version = "0.1.0"
description = "TransparentRO — transparența banilor publici: API + ETL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
  "pandas>=2.2",
  "python-calamine>=0.2.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "cachetools>=5.3",
  "email-validator>=2.1",
  "anthropic>=0.75",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
  "types-cachetools",
  "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tro*"]

[tool.setuptools.package-data]
tro = ["etl/*.yaml", "data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
