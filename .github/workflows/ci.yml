name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tro
          POSTGRES_PASSWORD: tro
          POSTGRES_DB: tro_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tro" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://tro:tro@localhost:5432/tro_test
      TEST_DATABASE_URL: postgresql+psycopg://tro:tro@localhost:5432/tro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check tro tests && ruff format --check tro tests
      - name: Tipuri (mypy)
        run: mypy tro
      - name: Migrări
        run: alembic upgrade head
      - name: Teste (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint
      - run: npx next build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Pornește stack-ul
        run: docker compose up -d --build db api web
      - name: Date sintetice pentru teste
        run: |
          docker compose --profile etl run --rm etl synthetic --reset
          docker compose --profile etl run --rm etl risk
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - if: failure()
        run: docker compose logs --tail=200
